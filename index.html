<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suhas Thakral, Head of Business Intelligence</title>
  <meta name="description" content="CV of Suhas Thakral, data and AI leader in Berlin, with an assistant that answers from the CV and shows its sources.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2A4A'/%3E%3Crect x='7' y='13' width='18' height='7' fill='%23FFD84D'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <main class="cv" id="cv"></main>

    <aside class="panel" id="panel" aria-label="Assistant">
      <header class="panel-head">
        <div>
          <h2>Ask about Suhas</h2>
          <p>AI assistant. It answers only from this CV and marks its sources on the page.</p>
        </div>
        <button class="close" id="closePanel" type="button" aria-label="Close assistant">Close</button>
      </header>

      <div class="tabs" role="tablist">
        <button role="tab" id="tabAsk" aria-controls="viewAsk" aria-selected="true" type="button">Ask a question</button>
        <button role="tab" id="tabFit" aria-controls="viewFit" aria-selected="false" type="button">Check a job ad</button>
      </div>

      <section class="view" id="viewAsk" role="tabpanel" aria-labelledby="tabAsk">
        <div class="log" id="log" aria-live="polite">
          <div class="starters" id="starters"></div>
        </div>
        <form class="composer" id="askForm">
          <label class="sr" for="question">Your question</label>
          <textarea id="question" rows="2" maxlength="1000" placeholder="Ask about his experience, skills or results"></textarea>
          <button type="submit">Ask</button>
        </form>
      </section>

      <section class="view" id="viewFit" role="tabpanel" aria-labelledby="tabFit" hidden>
        <div class="log" id="fitLog" aria-live="polite">
          <form id="fitForm" class="fit-form">
            <label for="jobAd">Paste a job ad to compare it with this CV. You'll see strengths, partial matches and gaps.</label>
            <textarea id="jobAd" rows="9" maxlength="12000" placeholder="Paste the role description here"></textarea>
            <button type="submit">Check fit</button>
          </form>
          <div id="fitResult"></div>
        </div>
      </section>
    </aside>
  </div>

  <button class="open" id="openPanel" type="button">Ask about Suhas</button>
  <script type="module" src="/app.js"></script>
</body>
</html>
